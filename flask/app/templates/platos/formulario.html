{% extends "layout.html" %}

{% block titulo %}Editar Plato{% endblock %}

{% block contenido %}
    <h1>Editar Plato</h1>

    <form action="{{ url_for('platos.editar_plato', plato_id=plato.id) }}" method="POST">
        <div>
            <label for="nombre">Nombre:*</label><br>
            <input type="text" id="nombre" name="nombre" value="{{ plato.nombre }}" required>
        </div>
        <br>

        <div>
            <label for="precio">Precio:*</label><br>
            <input type="number" step="0.01" id="precio" name="precio"
                   value="{{ '%.2f'|format(plato.precio) }}" min="0.01" required>
        </div>
        <br>

        <div>
            <label>
                <input type="checkbox" name="disponible" value="1"
                       {% if plato.disponible %}checked{% endif %}>
                Disponible
            </label>
        </div>
        <br>

        <button type="submit">Guardar Cambios</button>
    </form>

    <p><br><a href="{{ url_for('platos.detalle_plato', plato_id=plato.id) }}">Cancelar / Volver</a></p>
{% endblock %}
