<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}La Carta{% endblock %}</title>
</head>
<body>
    <header>
        <nav>
            <a href="{{ url_for('listar_restaurantes') }}">Restaurantes</a>
        </nav>
        <hr>
    </header>

    <main>
        <!-- Zona de mensajes flash -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <ul>
                    {% for categoria, mensaje in messages %}
                        <li style="color: {% if categoria == 'error' %}red{% else %}green{% endif %};">
                            {{ mensaje }}
                        </li>
                    {% endfor %}
                </ul>
            {% endif %}
        {% endwith %}

        {% block contenido %}{% endblock %}
    </main>
</body>
</html>
