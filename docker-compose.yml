services:
  flask:
    image: my-web-app:latest
    ports:
      - "5000:5000"
    environment:
      - ENV=production
    volumes:
      - ./app:/var/www/html
    depends_on:
      - db
  
  django:
    image: my-django-app:latest
    ports:
      - "8000:8000"
    environment:
      - ENV=production
    volumes:
      - ./django_app:/var/www/django
    depends_on:
      - db

  db:
    image: postgres:16
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_ROOT_PASSWORD=${POSTGRES_ROOT_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - database/schema.ddl:/docker-entrypoint-initdb.d/schema.ddl
volumes:
  pg_data: 