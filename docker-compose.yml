services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  flask:
    build:
      context: ./flask
      dockerfile: Dockerfile.dev
    env_file: .env
    ports: ["5000:5000"]
    volumes: ["./flask:/app"]
    depends_on:
      db:
        condition: service_healthy

  django:
    build: ./django_admin
    env_file: .env
    ports: ["8000:8000"]
    volumes: ["./django_admin:/app"]
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    env_file: .env
    ports: ["80:80"]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    depends_on:
      django:
        condition: service_healthy
      flask:
        condition: service_healthy

volumes:
  pg_data: