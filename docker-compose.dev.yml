services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  flask:
    build:
      context: ./backend/flask
      dockerfile: Dockerfile.dev
    env_file: .env
    ports: ["5000:5000"]
    volumes: ["./backend/flask:/app"]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy

  django:
    build:
      context: ./backend/django_admin
      dockerfile: Dockerfile.dev
    env_file: .env
    ports: ["8000:8000"]
    volumes: ["./backend/django_admin:/app"]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy

  # Frontend + API en un solo origen: http://localhost:8080
  # El frontend se monta en vivo: editas un .js y basta con recargar.
  nginx:
    image: nginx:alpine
    ports: ["8080:80"]
    volumes:
      - ./backend/nginx/nginx.dev.conf:/etc/nginx/nginx.conf:ro
      - ./backend/nginx/snippets:/etc/nginx/snippets:ro
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - flask

volumes:
  pg_data: