<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Restaurantes</title>
</head>
<body>
    <header>
        <nav>
            <a href="/restaurantes/">Restaurantes</a>
            <!-- Se muestran con JS según los permisos de GET /auth/me (solo UX). -->
            <a href="/pedidos/" id="nav-pedidos" style="margin-left: 1rem;" hidden>Mis pedidos</a>
            <a href="/cocina/" id="nav-cocina" style="margin-left: 1rem;" hidden>Cocina</a>
            <a href="/empleados/" id="nav-empleados" style="margin-left: 1rem;" hidden>Empleados</a>
            <span id="nav-usuario" style="margin-left: 1rem;" hidden></span>
            <button type="button" id="btn-logout" style="margin-left: 1rem;" hidden>Cerrar sesión</button>
            <a href="/auth/login" id="nav-login" style="margin-left: 1rem;">Iniciar sesión</a>
        </nav>
        <hr>
    </header>

    <main>
        <!-- Mensajes de éxito / error -->
        <ul id="mensajes"></ul>

    <h1>Restaurantes</h1>

    <form id="form-filtro" method="GET">
        <label for="ciudad">Filtrar por ciudad:</label>
        <input type="text" id="ciudad" name="ciudad">
        <button type="submit">Filtrar</button>
    </form>
    <br>

    <p id="acciones-carta" hidden>
        <a href="/restaurantes/formulario.html">Crear nuevo restaurante</a>
    </p>

    <table border="1" cellpadding="5" cellspacing="0">
        <thead>
            <tr><th>Nombre</th><th>Ciudad</th><th>Platos</th><th>Acciones</th></tr>
        </thead>
        <tbody id="lista-restaurantes"></tbody>
    </table>
    <p id="sin-restaurantes" hidden>No hay restaurantes registrados.</p>

    </main>
</body>
</html>
