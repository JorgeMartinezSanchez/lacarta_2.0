<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurante</title>
</head>
<body>
    <header>
        <nav>
            <a href="/restaurantes/">Restaurantes</a>
            <!-- Se muestran con JS según los permisos de GET /auth/me (solo UX). -->
            <a href="/pedidos/" id="nav-pedidos" style="margin-left: 1rem;" hidden>Mis pedidos</a>
            <a href="/cocina/" id="nav-cocina" style="margin-left: 1rem;" hidden>Cocina</a>
            <a href="/empleados/" id="nav-empleados" style="margin-left: 1rem;" hidden>Empleados</a>
            <span id="nav-usuario" style="margin-left: 1rem;" hidden></span>
            <button type="button" id="btn-logout" style="margin-left: 1rem;" hidden>Cerrar sesión</button>
            <a href="/auth/login" id="nav-login" style="margin-left: 1rem;">Iniciar sesión</a>
        </nav>
        <hr>
    </header>

    <main>
        <!-- Mensajes de éxito / error -->
        <ul id="mensajes"></ul>

    <!-- formulario.html crea; formulario.html?id=3 edita -->
    <h1 id="titulo-formulario">Registrar Nuevo Restaurante</h1>

    <form id="form-restaurante">
        <div>
            <label for="nombre">Nombre:*</label><br>
            <input type="text" id="nombre" name="nombre" required>
        </div>
        <br>
        <div>
            <label for="ciudad">Ciudad:*</label><br>
            <input type="text" id="ciudad" name="ciudad" required>
        </div>
        <br>
        <div>
            <label for="direccion">Dirección:</label><br>
            <input type="text" id="direccion" name="direccion">
        </div>
        <br>
        <div>
            <label for="telefono">Teléfono:</label><br>
            <input type="text" id="telefono" name="telefono">
        </div>
        <br>
        <button type="submit" id="btn-guardar">Crear Restaurante</button>
    </form>

    <p><br><a href="/restaurantes/">Cancelar / Volver</a></p>

    </main>
</body>
</html>
