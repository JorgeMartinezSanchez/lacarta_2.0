<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle del plato</title>
</head>
<body>
    <header>
        <nav>
            <a href="/restaurantes/">Restaurantes</a>
            <!-- Se muestran con JS según los permisos de GET /auth/me (solo UX). -->
            <a href="/pedidos/" id="nav-pedidos" style="margin-left: 1rem;" hidden>Mis pedidos</a>
            <a href="/cocina/" id="nav-cocina" style="margin-left: 1rem;" hidden>Cocina</a>
            <a href="/empleados/" id="nav-empleados" style="margin-left: 1rem;" hidden>Empleados</a>
            <span id="nav-usuario" style="margin-left: 1rem;" hidden></span>
            <button type="button" id="btn-logout" style="margin-left: 1rem;" hidden>Cerrar sesión</button>
            <a href="/auth/login" id="nav-login" style="margin-left: 1rem;">Iniciar sesión</a>
        </nav>
        <hr>
    </header>

    <main>
        <!-- Mensajes de éxito / error -->
        <ul id="mensajes"></ul>

    <h1 id="plato-nombre"></h1>
    <p><strong>Precio:</strong> $<span id="plato-precio"></span></p>
    <p><strong>Disponibilidad:</strong> <span id="plato-disponible"></span></p>
    <p><strong>Restaurante:</strong> <a href="#" id="plato-restaurante"></a></p>

    <p>
        <a href="#" id="link-editar" hidden>Editar Plato</a>
        <button type="button" id="btn-eliminar" style="color: red;" hidden>Eliminar Plato</button>
    </p>

    <p><br><a href="/platos/">Volver al listado de platos</a></p>

    </main>
</body>
</html>
