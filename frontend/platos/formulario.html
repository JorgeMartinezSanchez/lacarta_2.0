<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Plato</title>
</head>
<body>
    <header>
        <nav>
            <a href="/restaurantes/">Restaurantes</a>
            <!-- Se muestran con JS según los permisos de GET /auth/me (solo UX). -->
            <a href="/pedidos/" id="nav-pedidos" style="margin-left: 1rem;" hidden>Mis pedidos</a>
            <a href="/cocina/" id="nav-cocina" style="margin-left: 1rem;" hidden>Cocina</a>
            <a href="/empleados/" id="nav-empleados" style="margin-left: 1rem;" hidden>Empleados</a>
            <span id="nav-usuario" style="margin-left: 1rem;" hidden></span>
            <button type="button" id="btn-logout" style="margin-left: 1rem;" hidden>Cerrar sesión</button>
            <a href="/auth/login" id="nav-login" style="margin-left: 1rem;">Iniciar sesión</a>
        </nav>
        <hr>
    </header>

    <main>
        <!-- Mensajes de éxito / error -->
        <ul id="mensajes"></ul>

    <!-- formulario.html?id=3 -->
    <h1>Editar Plato</h1>

    <form id="form-plato">
        <div>
            <label for="nombre">Nombre:*</label><br>
            <input type="text" id="nombre" name="nombre" required>
        </div>
        <br>
        <div>
            <label for="precio">Precio:*</label><br>
            <input type="number" id="precio" name="precio" step="0.01" min="0.01" required>
        </div>
        <br>
        <div>
            <label><input type="checkbox" id="disponible" name="disponible"> Disponible</label>
        </div>
        <br>
        <button type="submit">Guardar Cambios</button>
    </form>

    <p><br><a href="#" id="link-volver">Cancelar / Volver</a></p>

    </main>
</body>
</html>
