<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Empleado</title>
</head>
<body>
    <header>
        <nav>
            <a href="/restaurantes/">Restaurantes</a>
            <!-- Se muestran con JS según los permisos de GET /auth/me (solo UX). -->
            <a href="/pedidos/" id="nav-pedidos" style="margin-left: 1rem;" hidden>Mis pedidos</a>
            <a href="/cocina/" id="nav-cocina" style="margin-left: 1rem;" hidden>Cocina</a>
            <a href="/empleados/" id="nav-empleados" style="margin-left: 1rem;" hidden>Empleados</a>
            <span id="nav-usuario" style="margin-left: 1rem;" hidden></span>
            <button type="button" id="btn-logout" style="margin-left: 1rem;" hidden>Cerrar sesión</button>
            <a href="/auth/login" id="nav-login" style="margin-left: 1rem;">Iniciar sesión</a>
        </nav>
        <hr>
    </header>

    <main>
        <!-- Mensajes de éxito / error -->
        <ul id="mensajes"></ul>

    <!-- formulario.html crea; formulario.html?id=3 edita -->
    <h1 id="titulo-formulario">Registrar Nuevo Empleado</h1>

    <form id="form-empleado">
        <div>
            <label for="primer_nombre">Primer nombre:*</label><br>
            <input type="text" id="primer_nombre" name="primer_nombre" maxlength="50" required>
        </div>
        <br>
        <div>
            <label for="segundo_nombre">Segundo nombre:</label><br>
            <input type="text" id="segundo_nombre" name="segundo_nombre" maxlength="50">
        </div>
        <br>
        <div>
            <label for="apellido">Apellido:*</label><br>
            <input type="text" id="apellido" name="apellido" maxlength="50" required>
        </div>
        <br>
        <div>
            <label for="ci">CI:*</label><br>
            <input type="text" id="ci" name="ci" maxlength="80" required>
        </div>
        <br>
        <div>
            <label for="telefono">Teléfono:*</label><br>
            <input type="text" id="telefono" name="telefono" maxlength="30" required>
        </div>
        <br>
        <div>
            <label for="email">Email:*</label><br>
            <input type="email" id="email" name="email" maxlength="200" required>
        </div>
        <br>
        <button type="submit" id="btn-guardar">Crear Empleado</button>
    </form>

    <p><br><a href="/empleados/">Cancelar / Volver</a></p>

    </main>
</body>
</html>
