<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle del pedido</title>
</head>
<body>
    <header>
        <nav>
            <a href="/restaurantes/">Restaurantes</a>
            <!-- Se muestran con JS según los permisos de GET /auth/me (solo UX). -->
            <a href="/pedidos/" id="nav-pedidos" style="margin-left: 1rem;" hidden>Mis pedidos</a>
            <a href="/cocina/" id="nav-cocina" style="margin-left: 1rem;" hidden>Cocina</a>
            <a href="/empleados/" id="nav-empleados" style="margin-left: 1rem;" hidden>Empleados</a>
            <span id="nav-usuario" style="margin-left: 1rem;" hidden></span>
            <button type="button" id="btn-logout" style="margin-left: 1rem;" hidden>Cerrar sesión</button>
            <a href="/auth/login" id="nav-login" style="margin-left: 1rem;">Iniciar sesión</a>
        </nav>
        <hr>
    </header>

    <main>
        <!-- Mensajes de éxito / error -->
        <ul id="mensajes"></ul>

    <h1>Pedido #<span id="pedido-id"></span></h1>

    <p><strong>Restaurante:</strong> <a href="#" id="pedido-restaurante"></a></p>
    <p><strong>Fecha:</strong> <span id="pedido-fecha"></span></p>
    <p><strong>Estado actual:</strong> <span id="pedido-estado"></span></p>

    <h2>Platos</h2>
    <table border="1" cellpadding="5" cellspacing="0">
        <thead>
            <tr><th>Plato</th><th>Cantidad</th><th>Precio unitario</th><th>Subtotal</th></tr>
        </thead>
        <tbody id="lista-items"></tbody>
        <tfoot>
            <tr><th colspan="3">Total</th><th>$<span id="pedido-total"></span></th></tr>
        </tfoot>
    </table>

    <!-- Solo se muestra si el pedido está pendiente; la regla real la aplica el servidor. -->
    <p><br><button type="button" id="btn-cancelar" style="color: red;" hidden>Cancelar pedido</button></p>

    <p><br><a href="/pedidos/">Volver a mis pedidos</a></p>

    </main>
</body>
</html>
