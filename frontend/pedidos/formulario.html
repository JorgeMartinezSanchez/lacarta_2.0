<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hacer un pedido</title>
</head>
<body>
    <header>
        <nav>
            <a href="/restaurantes/">Restaurantes</a>
            <!-- Se muestran con JS según los permisos de GET /auth/me (solo UX). -->
            <a href="/pedidos/" id="nav-pedidos" style="margin-left: 1rem;" hidden>Mis pedidos</a>
            <a href="/cocina/" id="nav-cocina" style="margin-left: 1rem;" hidden>Cocina</a>
            <a href="/empleados/" id="nav-empleados" style="margin-left: 1rem;" hidden>Empleados</a>
            <span id="nav-usuario" style="margin-left: 1rem;" hidden></span>
            <button type="button" id="btn-logout" style="margin-left: 1rem;" hidden>Cerrar sesión</button>
            <a href="/auth/login" id="nav-login" style="margin-left: 1rem;">Iniciar sesión</a>
        </nav>
        <hr>
    </header>

    <main>
        <!-- Mensajes de éxito / error -->
        <ul id="mensajes"></ul>

    <!-- formulario.html?restaurante_id=1 -->
    <h1>Hacer un pedido en <span id="restaurante-nombre"></span></h1>
    <p>Indica cuántas unidades quieres de cada plato (de 1 a 20). Deja en 0 los que no pidas.</p>

    <!-- Solo se envían plato y cantidad: el precio y el total los calcula el servidor (R1.4). -->
    <form id="form-pedido">
        <table border="1" cellpadding="5" cellspacing="0">
            <thead>
                <tr><th>Plato</th><th>Precio</th><th>Cantidad</th></tr>
            </thead>
            <tbody id="lista-platos"></tbody>
        </table>
        <br>
        <button type="submit">Hacer pedido</button>
    </form>
    <p id="sin-platos" hidden>Este restaurante no tiene platos disponibles en este momento.</p>

    <p><br><a href="#" id="link-volver">Volver al restaurante</a></p>

    </main>
</body>
</html>
