<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cocina</title>
</head>
<body>
    <header>
        <nav>

            <a href="/cocina/" id="nav-cocina" style="margin-left: 1rem;" hidden>Cocina</a>

    </main>
