# Nginx para desarrollo local (docker-compose.dev.yml): solo HTTP, sin certificados.
# Entra por http://localhost:8080
events {}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    resolver 127.0.0.11 valid=10s;   # DNS interno de Docker
    server_tokens off;

    server {
        listen 80 default_server;
        server_name _;

        include /etc/nginx/snippets/lacarta.conf;
    }
}
