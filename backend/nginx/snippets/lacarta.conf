# Rutas de La Carta: frontend vanilla + API Flask en el MISMO origen.
# Mismo origen = la cookie de sesión de Flask viaja sola en cada fetch
# (sin CORS). Lo incluyen el server HTTPS de producción y el de desarrollo.

# ---------- API (Flask) ----------
# Solo estos prefijos van a Flask; todo lo demás es el frontend.
location ~ ^/(restaurantes|platos|pedidos|cocina|empleados|auth|health)(/|$) {
    set $flask_backend flask;
    proxy_pass http://$flask_backend:5000;
    include /etc/nginx/snippets/proxy.conf;
}

# ---------- Frontend (archivos estáticos) ----------
root /usr/share/nginx/html;   # aquí se monta ../frontend
index index.html;

location / {
    # Las vistas viven en el hash (#/platos/3), así que cualquier ruta
    # desconocida devuelve index.html y el router JS decide.
    try_files $uri $uri/ /index.html;
}

# index.html sin caché: así un deploy nuevo se ve al recargar.
location = /index.html {
    add_header Cache-Control "no-cache";
}

# Módulos JS y CSS: el navegador revalida (son pocos y pequeños).
location ~* \.(js|css)$ {
    add_header Cache-Control "no-cache";
}
