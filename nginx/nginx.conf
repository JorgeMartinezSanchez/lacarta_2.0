events {}

http {
    # DNS interno de Docker
    resolver 127.0.0.11 valid=30s;

    # Ajustes comunes a todos los servidores
    server_tokens off;
    client_max_body_size 10M;

    # ---------- La Carta (Flask): HTTP -> HTTPS ----------
    server {
        listen 80;
        server_name lacarta2.mooo.com;
        return 301 https://$host$request_uri;
    }

    # ---------- La Carta (Flask): HTTPS ----------
    server {
        listen 443 ssl;
        http2 on;
        server_name lacarta2.mooo.com;

        ssl_certificate     /etc/letsencrypt/live/lacarta2.mooo.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/lacarta2.mooo.com/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;

        location /static/ {
            alias /app/static/;
        }

        location / {
            set $flask_backend flask;
            proxy_pass http://$flask_backend:5000;
            include /etc/nginx/snippets/proxy.conf;
        }
    }

    # ---------- Admin (Django) ----------
    server {
        listen 80;
        server_name lacarta2-admin.mooo.com;

        location /static/ {
            alias /app/static/;
        }

        location / {
            set $django_upstream django;
            proxy_pass http://$django_upstream:8000;
            include /etc/nginx/snippets/proxy.conf;
        }
    }
}