events {}

http {
    # Usar el DNS interno de Docker
    resolver 127.0.0.11 valid=30s;

    server {
        listen 80;
        server_name lacarta2.mooo.com;
        server_tokens off;
        client_max_body_size 10M;

        location /static/ {
            alias /app/static/;
        }

        location / {
            set $flask_upstream flask;
            proxy_pass http://$flask_upstream:5000;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_redirect off;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }
    }

    server {
        listen 80;
        server_name lacarta2-admin.mooo.com;
        server_tokens off;
        client_max_body_size 10M;

        location /static/ {
            alias /app/static/;
        }

        location / {
            set $django_upstream django;
            proxy_pass http://$django_upstream:8000;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_redirect off;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }
    }
}